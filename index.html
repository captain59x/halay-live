
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HALAY LIVE 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d1b;color:#fff;font-family:system-ui,-apple-system,sans-serif}
#game{position:fixed;inset:0;background:radial-gradient(#533044,#151020)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;text-shadow:0 2px 8px #000}
.brand{font-weight:950;letter-spacing:1.5px;font-size:19px}
.sub{font-size:10px;opacity:.8;letter-spacing:2px}
.live{background:#dc285b;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:900}
#top-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;pointer-events:auto;margin-top:10px}
button{border:1px solid #ffffff45;background:linear-gradient(145deg,#8e3769,#482347);color:#fff;border-radius:11px;padding:10px 3px;font-size:11px;font-weight:850;min-height:49px;box-shadow:0 3px 9px #0005}
button:active{transform:scale(.96)}
button.gold{background:linear-gradient(145deg,#f4cf7a,#b4772c);color:#271629}
#bottom{pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:#130e20c9;border:1px solid #ffffff30;border-radius:10px;padding:7px;text-align:center}
.stat b{display:block;font-size:19px}
.stat small{font-size:9px;opacity:.75}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#feed{height:54px;overflow:hidden;background:#130e20c9;border:1px solid #ffffff30;border-radius:10px;padding:7px 9px;font-size:11px;line-height:1.5}
#hint{text-align:center;font-size:10px;text-shadow:0 2px 6px #000}
#toast{position:absolute;top:37%;left:50%;transform:translate(-50%,-50%);background:#1b1225e8;border:1px solid #f5d18b;border-radius:14px;padding:12px 18px;text-align:center;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
@media(min-width:700px){#hud{max-width:600px;margin:auto;left:0;right:0}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<div>
<header>
<div><div class="brand">🇹🇷 HALAY LIVE 3D</div><div class="sub">TÜRK DÜĞÜN SALONU</div></div>
<span class="live">● DEMO LIVE</span>
</header>
<div id="top-actions">
<button class="gold" id="connectTikTok">🔴<br>TIKTOK LIVE</button>
<button data-act="join">🌹<br>HALAYA KATIL</button>
<button data-act="leader">⭐<br>HALAY BAŞI</button>
<button data-act="bride">💗<br>GELİN OL</button>
<button data-act="groom">👑<br>DAMAT OL</button>
<button class="gold" data-act="money">💰<br>PARA YAĞDIR</button>
</div>
</div>
<div id="bottom">
<div id="hint">🎺 DAVUL • ZURNA • HALAY — 3D MOBİL DEMO</div>
<div class="stats">
<div class="stat"><b id="count">8</b><small>TÄNZER</small></div>
<div class="stat"><b id="gifts">0</b><small>GESCHENKE</small></div>
<div class="stat"><b id="coins">0</b><small>DEMO COINS</small></div>
</div>
<div id="feed">🇹🇷 Hoş geldiniz! Halay başladı.<br>💃 Willkommen zur Hochzeit!</div>
<div class="controls">
<button id="comment">💬 HALAY kommentieren</button>
<button id="gift">🎁 Geschenk simulieren</button>
<button id="remove">➖ Tänzer entfernen</button>
<button id="reset">↻ Zurücksetzen</button>
</div>
</div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/playroomkit/multiplayer.full.umd.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
const liveStatus=document.querySelector('.live');
let tiktokConnected=false;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x24172b);
scene.fog=new THREE.Fog(0x24172b,19,34);

const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);
camera.position.set(0,12,18);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe7d0,0x39233f,2.1));

const key=new THREE.DirectionalLight(0xffd8a1,2.4);
key.position.set(-5,12,8);
key.castShadow=true;
scene.add(key);

const pink=new THREE.PointLight(0xe75b94,35,18);
pink.position.set(-7,5,-5);
scene.add(pink);

const blue=new THREE.PointLight(0x668cff,28,18);
blue.position.set(7,5,-5);
scene.add(blue);

function mat(color,rough=.75,metal=0){
return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}

const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),mat(0xb6a79c));
floor.rotation.x=-Math.PI/2;
floor.position.y=-.04;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(28,28,0x79695f,0x9a8b80);
grid.position.y=.005;
scene.add(grid);

const back=new THREE.Mesh(new THREE.BoxGeometry(22,8,.5),mat(0x49263c));
back.position.set(0,4,-10);
scene.add(back);

const stage=new THREE.Mesh(new THREE.BoxGeometry(8,.35,2.4),mat(0x8d4a56));
stage.position.set(0,.18,-6.7);
scene.add(stage);

const arch=new THREE.Mesh(new THREE.TorusGeometry(3.4,.16,12,64,Math.PI),mat(0xe6bd70,.35,.45));
arch.position.set(0,4.1,-9.65);
scene.add(arch);

for(let x=-8;x<=8;x+=4){
const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.13,.2,7,12),mat(0xc99d66,.4,.4));
pillar.position.set(x,3.5,-9.6);
scene.add(pillar);
}

for(let x=-7;x<=7;x+=3.5){
const bulb=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),new THREE.MeshBasicMaterial({color:0xffd78a}));
bulb.position.set(x,6.5,-3);
scene.add(bulb);
const light=new THREE.PointLight(0xffc76e,12,9);
light.position.copy(bulb.position);
scene.add(light);
}

const chandelier=new THREE.Group();
const chain=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,1.3,8),mat(0xd7b16e,.3,.7));
chain.position.y=5.65;
chandelier.add(chain);

const ring=new THREE.Mesh(new THREE.TorusGeometry(.85,.09,10,32),mat(0xe7bd70,.25,.65));
ring.rotation.x=Math.PI/2;
ring.position.y=4.95;
chandelier.add(ring);

for(let i=0;i<8;i++){
let a=i*Math.PI/4;
let bulb=new THREE.Mesh(new THREE.SphereGeometry(.12,12,10),new THREE.MeshStandardMaterial({color:0xffe4a2,emissive:0x9b5c18,emissiveIntensity:.8}));
bulb.position.set(Math.cos(a)*.85,4.9,Math.sin(a)*.85);
chandelier.add(bulb);
}
scene.add(chandelier);

function labelTexture(text){
const c=document.createElement('canvas');
c.width=256;
c.height=64;
const ctx=c.getContext('2d');
ctx.fillStyle='rgba(25,16,36,.88)';
ctx.beginPath();
ctx.roundRect(3,5,250,54,15);
ctx.fill();
ctx.strokeStyle='#dfbd7d';
ctx.lineWidth=3;
ctx.stroke();
ctx.fillStyle='#fff4dc';
ctx.font='bold 25px system-ui';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(text.slice(0,18),128,33);
const t=new THREE.CanvasTexture(c);
t.colorSpace=THREE.SRGBColorSpace;
return t;
}

const skinColors=[0xd49b76,0xe2b28e,0xb87d5e,0xc78f6b,0xe6b996];
const shirts=[0x315c83,0xb8445e,0x27765c,0xc79b45,0x674b83,0xeee2d1,0x873c37];
const hairs=[0x211b1b,0x493126,0x25201d,0x70442e];

function makePerson(name,opts={}){
const g=new THREE.Group();
g.userData={phase:Math.random()*6.28,name};

const skin=mat(opts.skin||skinColors[Math.floor(Math.random()*skinColors.length)]);
const shirt=mat(opts.shirt||shirts[Math.floor(Math.random()*shirts.length)]);
const pants=mat(opts.pants||0x282638);
const hair=mat(opts.hair||hairs[Math.floor(Math.random()*hairs.length)]);

const torso=new THREE.Mesh(new THREE.BoxGeometry(.48,.67,.28),shirt);
torso.position.y=1.15;
torso.castShadow=true;
g.add(torso);

const neck=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.15,10),skin);
neck.position.y=1.56;
g.add(neck);

const head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),skin);
head.scale.set(.88,1.08,.9);
head.position.y=1.83;
g.add(head);

const haircap=new THREE.Mesh(new THREE.SphereGeometry(.235,16,10,0,Math.PI*2,0,Math.PI*.53),hair);
haircap.position.y=1.91;
g.add(haircap);

const eyes=mat(0x211b1b);
for(let x of [-.075,.075]){
const eye=new THREE.Mesh(new THREE.SphereGeometry(.018,8,6),eyes);
eye.position.set(x,1.85,.199);
g.add(eye);
}

const arms=[];
for(let side of [-1,1]){
const pivot=new THREE.Group();
pivot.position.set(side*.3,1.42,0);
const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.42,4,8),shirt);
arm.position.y=-.25;
pivot.add(arm);
const hand=new THREE.Mesh(new THREE.SphereGeometry(.085,10,8),skin);
hand.position.y=-.51;
pivot.add(hand);
pivot.rotation.z=side*.55;
g.add(pivot);
arms.push(pivot);
}

const legs=[];
for(let side of [-1,1]){
const pivot=new THREE.Group();
pivot.position.set(side*.13,.83,0);
const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.48,4,8),pants);
leg.position.y=-.28;
pivot.add(leg);
const shoe=new THREE.Mesh(new THREE.BoxGeometry(.19,.1,.3),mat(0x211b23));
shoe.position.set(0,-.56,.07);
pivot.add(shoe);
g.add(pivot);
legs.push(pivot);
}

const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTexture(name),transparent:true,depthTest:false}));
tag.position.y=2.35;
tag.scale.set(1.45,.36,1);
g.add(tag);

g.userData.arms=arms;
g.userData.legs=legs;
return g;
}

const dancers=[];
let gifts=0,coins=0,seq=0;

function update(){
document.querySelector('#count').textContent=dancers.length;
document.querySelector('#gifts').textContent=gifts;
document.querySelector('#coins').textContent=coins;
}

function feed(message){
const f=document.querySelector('#feed');
f.innerHTML='';
const p=document.createElement('div');
p.textContent=message;
f.append(p);
const old=document.createElement('div');
old.textContent='🇹🇷 Halay devam ediyor!';
f.append(old);
}

let toastTimer;
function toast(message){
const t=document.querySelector('#toast');
t.textContent=message;
t.classList.add('show');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove('show'),1400);
}

function addDancer(name,opts={}){
if(dancers.length>=24){
toast('Tanzfläche ist voll!');
return;
}
const g=makePerson(name,opts);
const i=dancers.length;
const angle=(i/24)*Math.PI*2;
const radius=i<8?4.2:5.7;
g.position.set(Math.cos(angle)*radius,0,Math.sin(angle)*radius*.64);
g.rotation.y=-angle*.35;
scene.add(g);
dancers.push(g);
update();
feed('💃 '+name+' ist dem Halay beigetreten!');
}

function makeCouple(){
const groom=makePerson('DAMAT',{shirt:0x171c31,pants:0x171827});
groom.position.set(-.65,0,-.25);
groom.scale.setScalar(1.13);
scene.add(groom);
dancers.push(groom);

const bride=makePerson('GELİN',{shirt:0xffeee4,pants:0xffeee4});
bride.position.set(.65,0,-.25);
bride.scale.setScalar(1.13);
scene.add(bride);
dancers.push(bride);
}

function clearPeople(){
dancers.forEach(d=>scene.remove(d));
dancers.length=0;
}

function reset(){
clearPeople();
gifts=0;
coins=0;
seq=0;
makeCouple();
for(const name of ['Kadir','Ayşe Nur','Ferit Arda','Ömer','Deniz','Elif'])addDancer(name);
update();
feed('🇹🇷 Halay yeniden başladı!');
}

reset();

document.querySelectorAll('[data-act]').forEach(button=>{
button.addEventListener('click',()=>{
const action=button.dataset.act;
if(action==='join')addDancer('Misafir '+(++seq));
if(action==='leader'){
addDancer('HALAY BAŞI ⭐',{shirt:0xd5a33e});
toast('⭐ Halay başı seçildi!');
}
if(action==='bride'){
toast('💗 Gelin-Rolle ausgewählt!');
feed('💗 Zuschauerin wurde zur Braut gewählt!');
}
if(action==='groom'){
toast('👑 Damat-Rolle ausgewählt!');
feed('👑 Zuschauer wurde zum Bräutigam gewählt!');
}
if(action==='money'){
gifts++;
coins+=100;
update();
toast('💰 PARA YAĞDIR!');
feed('💰 Geldregen! +100 Demo-Coins');
}
});
});

document.querySelector('#connectTikTok').onclick=async()=>{
const btn=document.querySelector('#connectTikTok');
if(!window.Playroom){
toast('Playroom konnte nicht geladen werden');
return;
}
if(tiktokConnected){
toast('TikTok-Verbindung läuft bereits');
return;
}
btn.disabled=true;
btn.textContent='⏳ VERBINDE…';
try{
await window.Playroom.insertCoin({liveMode:'tiktok'});
window.Playroom.onTikTokLiveEvent(event=>{
const data=event.data||{};
const username=data.username||'TikTok Gast';
const photo=data.userPhotoUrl||'';
if(event.type==='chat'){
const comment=(data.comment||'').trim();
const upper=comment.toUpperCase();
if(upper.includes('GELIN'))addDancer(username,{photo,shirt:0xffe8ef,pants:0xffe8ef});
else if(upper.includes('DAMAT'))addDancer(username,{photo,shirt:0x171c31});
else addDancer(username,{photo});
feed('💬 @'+username+': '+comment);
}else if(event.type==='gift'){
gifts++;
coins+=10;
addDancer(username,{photo,shirt:0xd5a33e});
toast('🎁 Geschenk von @'+username);
update();
}else if(event.type==='like'){
coins+=1;
update();
feed('❤️ Likes von @'+username);
}
});
tiktokConnected=true;
btn.textContent='🟢 LIVE VERBUNDEN';
liveStatus.textContent='● TIKTOK VERBUNDEN';
toast('TikTok-Verbindung gestartet');
}catch(err){
console.error(err);
btn.disabled=false;
btn.textContent='🔴 TIKTOK LIVE';
toast('Verbindung fehlgeschlagen');
}
};

document.querySelector('#comment').onclick=()=>addDancer('TikTok Misafir '+(++seq));
document.querySelector('#gift').onclick=()=>{
gifts++;
coins+=10;
addDancer('Gift Misafir');
toast('🎁 Geschenk-Effekt!');
update();
};

document.querySelector('#remove').onclick=()=>{
if(dancers.length>2){
scene.remove(dancers.pop());
update();
feed('Ein Tänzer hat die Tanzfläche verlassen.');
}
};

document.querySelector('#reset').onclick=reset;

const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const t=clock.getElapsedTime();
dancers.forEach(d=>{
const p=d.userData.phase;
d.position.y=.045+Math.abs(Math.sin(t*5+p))*.07;
d.userData.arms.forEach((arm,i)=>{
arm.rotation.z=(i===0?1:-1)*(.5+Math.sin(t*5+p+i)*.55);
arm.rotation.x=Math.sin(t*5+p+i)*.2;
});
d.userData.legs.forEach((leg,i)=>{
leg.rotation.x=Math.sin(t*5+p+i*Math.PI)*.38;
leg.rotation.z=Math.sin(t*2.5+p+i)*.12;
});
});
chandelier.rotation.y=Math.sin(t*.3)*.04;
renderer.render(scene,camera);
}
animate();

function resize(){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
}
addEventListener('resize',resize);

let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{
if(!down)return;
let dx=e.clientX-down.x;
if(Math.abs(dx)>45){
camera.position.x=Math.max(-3,Math.min(3,camera.position.x+dx*.012));
camera.lookAt(0,0,0);
}
down=null;
});
</script>
</body>
</html>
